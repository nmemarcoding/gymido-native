# Log in opens Auth0 Universal Login in the system browser, and cancelling
# returns to Welcome.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-out.yaml
- runFlow: subflows/open-login-page.yaml
# Parity with the web: Google sign-in is offered on the hosted page.
- assertVisible: "Continue with Google"
- runFlow: subflows/cancel-universal-login.yaml
- extendedWaitUntil:
    visible:
      id: "welcome-log-in"
    timeout: 60000
