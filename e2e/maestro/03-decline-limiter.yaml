# Spec §4: fewer than 3 cancels in 60s recover silently; the 3rd shows the
# Sign-in failed card.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-out.yaml
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "welcome-log-in"
      - waitForAnimationToEnd:
          timeout: 8000
      - runFlow: subflows/dismiss-browser-interstitials.yaml
      # QA s3-p2: Maestro can't always read the custom tab's WEB content for a
      # moment; on Android anchor on Chrome's native close button (always
      # readable), on iOS on the form's text.
      - runFlow:
          when:
            platform: Android
          commands:
            - extendedWaitUntil:
                visible:
                  id: "com.android.chrome:id/close_button"
                timeout: 90000
      - runFlow:
          when:
            platform: iOS
          commands:
            - runFlow: subflows/wait-for-login-form.yaml
      - runFlow: subflows/cancel-universal-login.yaml
      - extendedWaitUntil:
          visible: "Gymido|Sign-in failed"
          timeout: 60000
- assertVisible: "Sign-in failed"
- assertVisible: "Auth0 rejected the login request."
- assertVisible:
    id: "sign-in-failed-try-again"
