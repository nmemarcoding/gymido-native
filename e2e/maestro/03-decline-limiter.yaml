# Spec §4: fewer than 3 cancels in 60s recover silently; the 3rd shows the
# Sign-in failed card.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-out.yaml
- repeat:
    times: 3
    commands:
      # open-login-page waits on Chrome's url_bar on Android, which stays
      # current when a Custom Tab is reopened (the web page's accessibility
      # tree can go stale then).
      - runFlow: subflows/open-login-page.yaml
      - runFlow: subflows/cancel-universal-login.yaml
      - extendedWaitUntil:
          visible: "Gymido|Sign-in failed"
          timeout: 60000
- assertVisible: "Sign-in failed"
- assertVisible: "Auth0 rejected the login request."
- assertVisible:
    id: "sign-in-failed-try-again"
