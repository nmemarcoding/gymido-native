# v2 Phase 1 large text: the tab bar goes ICONS ONLY above a 1.3 text scale.
# Account: QA_MEMBER (or QA_TRAINER; runs in the Personal workspace).
#
# LEAD, BEFORE this flow (Maestro cannot change the system text size):
#   iOS:     xcrun simctl ui <udid> content_size accessibility-large
#   Android: adb -s <serial> shell settings put system font_scale 2.0
# LEAD, AFTER (back to default):
#   iOS:     xcrun simctl ui <udid> content_size large
#   Android: adb -s <serial> shell settings put system font_scale 1.0
# Start: signed in (changing the size before launch or while open both work).
#
# Checks: the same bar shows, no tab shows its text label (Android: label
# child gone; iOS exposes each tab as one element, so the icons-only look is
# checked on the named screenshot), every tab id is still tappable and opens
# its root. Profile root not asserted on (owner rule).
appId: com.gymido.app
tags:
  - v2
  - phase1
  - large-text
  - member
---
- runFlow: ../../subflows/signed-in-start.yaml
- runFlow: ../../subflows/member-workspace.yaml
- tapOn:
    id: "tab-Today"
- extendedWaitUntil:
    visible:
      id: "home-header"
    timeout: 30000
- assertVisible:
    id: "bottom-nav-bar"

# Icons only: no text label child on any tab (Android).
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible:
          id: "tab-Today"
          containsChild:
            text: "Today"
      - assertNotVisible:
          id: "tab-Plans"
          containsChild:
            text: "Plans"
      - assertNotVisible:
          id: "tab-Exercises"
          containsChild:
            text: "Exercises"
      - assertNotVisible:
          id: "tab-Progress"
          containsChild:
            text: "Progress"
      - assertNotVisible:
          id: "tab-Profile"
          containsChild:
            text: "Profile"
- takeScreenshot: v2-p1-large-text-tab-bar-today

# Every tab id still works at this size.
- tapOn:
    id: "tab-Plans"
- extendedWaitUntil:
    visible:
      id: "plans-library-screen"
    timeout: 30000
- assertVisible:
    id: "tab-Plans"
    selected: true
- tapOn:
    id: "tab-Exercises"
- extendedWaitUntil:
    visible:
      id: "exercises-screen"
    timeout: 30000
- tapOn:
    id: "tab-Progress"
- extendedWaitUntil:
    visible:
      id: "progress-tabs|progress-error"
    timeout: 30000
- tapOn:
    id: "tab-Profile"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "tab-Profile"
    selected: true
- tapOn:
    id: "tab-Today"
- extendedWaitUntil:
    visible:
      id: "home-header"
    timeout: 30000
- runFlow: ../../subflows/restore-workspace.yaml
