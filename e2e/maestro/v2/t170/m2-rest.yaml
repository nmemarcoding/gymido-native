# T-170 §9.1 matrix, rest sheet: log the current set (in the session m1 started), the rest sheet opens. IDs only.
# Large text: Did it can sit below the fold, so scroll to it first (a no-op when it's on screen).
appId: com.gymido.app
---
- scrollUntilVisible: { element: { id: "set-action-.*" }, direction: DOWN, timeout: 10000, visibilityPercentage: 50, centerElement: true }
# T-171 carry (UNRUN, PM 31 Oct): lift a bottom-band target above the system bars before the tap (at large text Maestro
# tapped the transparent 3-button nav bar). Content moves up ~20 %; a target already mid-screen stays on screen.
- swipe: { start: "50%, 72%", end: "50%, 52%", duration: 400 }
- runFlow: ../subflows/log-current-set.yaml
- extendedWaitUntil: { visible: { id: "rest-timer-skip|rest-sheet" }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
