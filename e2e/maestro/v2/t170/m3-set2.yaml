# T-170 §9.1 matrix, cell "N1 s2": back from the disc to the sheet, Skip the rest, the live screen at set 2. IDs only.
appId: com.gymido.app
---
- runFlow:
    when:
      visible: { id: "rest-mini-ring" }
    commands:
      - tapOn: { id: "rest-timer" }
      - extendedWaitUntil: { visible: { id: "rest-sheet" }, timeout: 5000 }
- scrollUntilVisible: { element: { id: "rest-timer-skip" }, direction: DOWN, timeout: 5000, visibilityPercentage: 50 }
- tapOn: { id: "rest-timer-skip" }
- extendedWaitUntil: { notVisible: { id: "rest-sheet" }, timeout: 5000 }
- runFlow: ../subflows/dismiss-session-dialogs.yaml
- waitForAnimationToEnd: { timeout: 3000 }
