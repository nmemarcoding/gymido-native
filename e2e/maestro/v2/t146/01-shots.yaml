# T-146 parity shots (phone): the live set card (set 1, set 2 with the previous-set pill, the edit state), Rest 1, the
# red last 5 s, Rest 3 (after an exercise's last set), and the browse states (not started, partly done, all done).
# Fixture: a throwaway member with an ACTIVE plan that offers a Start today, 3+ exercises of 3 sets, rest times set.
# Starts signed in (the lead's safe runner). Ends on a running rest; run t146/02-discard.yaml after it. IDs + patterns only, no
# credentials, no Profile shots. ${SHOT} prefixes every screenshot (e.g. android-411, android-360, ios-17).
appId: com.gymido.app
---
# DECLARED (T-153, PM-approved): the phone rest is a sheet: marker "rest-ring-box|rest-sheet", minimise via the
# handle "rest-sheet-handle" (the tablet keeps rest-timer-minimize), copy "Get ready for the next exercise!" / "Skip Rest".
- runFlow: ../subflows/signed-in-start.yaml
- runFlow: ../subflows/start-workout.yaml
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-01-set1
# Set 1 → Rest 1 (mid-exercise).
- runFlow: ../subflows/log-current-set.yaml
- extendedWaitUntil: { visible: { id: "rest-timer-skip" }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-02-rest1
- tapOn: { id: "rest-timer-skip" }
- extendedWaitUntil: { notVisible: { id: "rest-timer" }, timeout: 5000 }
- runFlow: ../subflows/dismiss-session-dialogs.yaml
# Set 2: the previous-set pill; the edit state; Cancel.
- scrollUntilVisible: { element: { id: "set-previous-.*" }, direction: DOWN, centerElement: true, timeout: 10000 }
- takeScreenshot: ${SHOT}-03-set2
- tapOn: { id: "set-previous-.*" }
- extendedWaitUntil: { visible: { id: "set-cancel-.*" }, timeout: 5000 }
- takeScreenshot: ${SHOT}-04-edit
- tapOn: { id: "set-cancel-.*" }
# Browse a not-started exercise (exercise 3).
- scrollUntilVisible: { element: { id: "session-all" }, direction: UP, timeout: 10000 }
- tapOn: { id: "session-all" }
- extendedWaitUntil: { visible: { id: "exercise-sheet" }, timeout: 10000 }
- tapOn: { id: "exercise-sheet-card-2" }
- extendedWaitUntil: { visible: { id: "browsing-bar" }, timeout: 5000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-05-browse-not-started
- tapOn: { id: "browsing-resume" }
- extendedWaitUntil: { notVisible: { id: "browsing-bar" }, timeout: 5000 }
# Log the rest of exercise 1 (skipping each mid-exercise rest) until Rest 3 ("Get ready for the next exercise!").
- repeat:
    while:
      notVisible: "Get ready for the next exercise!"
    times: 8
    commands:
      - runFlow: ../subflows/log-current-set.yaml
      - extendedWaitUntil: { visible: { id: "rest-timer-skip" }, timeout: 10000 }
      - runFlow:
          when:
            visible: "Skip Rest"
          commands:
            - tapOn: { id: "rest-timer-skip" }
            - extendedWaitUntil: { notVisible: { id: "rest-timer" }, timeout: 5000 }
            - runFlow: ../subflows/dismiss-session-dialogs.yaml
- extendedWaitUntil: { visible: "Get ready for the next exercise!", timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-07-rest3
- tapOn: { id: "rest-timer-skip" }
- extendedWaitUntil: { notVisible: { id: "rest-timer" }, timeout: 5000 }
- runFlow: ../subflows/dismiss-session-dialogs.yaml
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-08-ex2-set1
# Exercise 2, set 1 → skip its rest; browse exercise 1 (all done): Locked; its done segment → Undo set k + Cancel.
- runFlow: ../subflows/log-current-set.yaml
- extendedWaitUntil: { visible: { id: "rest-timer-skip" }, timeout: 10000 }
- tapOn: { id: "rest-timer-skip" }
- extendedWaitUntil: { notVisible: { id: "rest-timer" }, timeout: 5000 }
- runFlow: ../subflows/dismiss-session-dialogs.yaml
- scrollUntilVisible: { element: { id: "session-all" }, direction: UP, timeout: 10000 }
- tapOn: { id: "session-all" }
- extendedWaitUntil: { visible: { id: "exercise-sheet" }, timeout: 10000 }
- tapOn: { id: "exercise-sheet-card-0" }
- extendedWaitUntil: { visible: { id: "browsing-bar" }, timeout: 5000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-09-browse-all-done
- scrollUntilVisible: { element: { id: "set-segment-.*" }, direction: DOWN, centerElement: true, timeout: 10000 }
- tapOn: { id: "set-segment-.*", index: 0 }
- extendedWaitUntil: { visible: { id: "set-undo-.*" }, timeout: 5000 }
- takeScreenshot: ${SHOT}-10-browse-undo
# Undo it: exercise 1 has an open set again, so it is live; exercise 2 (1 of 3 done) can now be browsed partly done.
# The row can sit under the bottom navigator: centre it first.
- scrollUntilVisible: { element: { id: "set-undo-.*" }, direction: DOWN, centerElement: true, timeout: 10000 }
- tapOn: { id: "set-undo-.*", text: "Undo set .*" }
- extendedWaitUntil: { notVisible: { id: "browsing-bar" }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-11-live-after-undo
- scrollUntilVisible: { element: { id: "session-all" }, direction: UP, timeout: 10000 }
- tapOn: { id: "session-all" }
- extendedWaitUntil: { visible: { id: "exercise-sheet" }, timeout: 10000 }
- tapOn: { id: "exercise-sheet-card-1" }
- extendedWaitUntil: { visible: { id: "browsing-bar" }, timeout: 5000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-12-browse-partly
- scrollUntilVisible: { element: { id: "session-stats-line" }, direction: DOWN, timeout: 10000 }
- takeScreenshot: ${SHOT}-13-browse-partly-scrolled
- scrollUntilVisible: { element: { id: "browsing-resume" }, direction: UP, timeout: 10000 }
- tapOn: { id: "browsing-resume" }
- extendedWaitUntil: { notVisible: { id: "browsing-bar" }, timeout: 5000 }
# LAST: a rest run into its last 5 s (red). Maestro can't poll the screen while the drain fill animates, so this is
# the flow's final step: the rest then ends by itself, and the lead discards the session afterwards (the session this
# flow started; t146/02-discard.yaml).
- runFlow: ../subflows/log-current-set.yaml
- extendedWaitUntil: { visible: { id: "rest-timer-skip" }, timeout: 10000 }
- extendedWaitUntil:
    visible: { id: "rest-countdown", text: "0:0[45]" }
    timeout: 240000
- takeScreenshot: ${SHOT}-14-rest-red
