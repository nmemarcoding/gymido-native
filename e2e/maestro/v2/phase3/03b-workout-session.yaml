# v2 Phase 3 §3 Workout (UX F1), team 3b.
# Account: QA_MEMBER with an ACTIVE plan. Start: signed in on a tab root.
# Uses the v2 subflows (start-workout / discard-workout); the session this
# flow starts is always discarded, so nothing is recorded. No set is logged
# ("Did it" would write a real set); its PATCH path is Jest-covered.
#
# Checks: one chrome (Exit · plan + sets done · timer · All); the single set
# editor with weight/reps steppers; − at one step clears the weight; How to
# opens over the workout and closes back; All (n) → another exercise shows
# the browsing bar + stats + exercise nav and Resume returns; Exit → Discard
# dialog, Keep going keeps the session; the discard-workout subflow ends it.
appId: com.gymido.app
tags:
  - v2
  - phase3
  - member
# Confirm dfd9b85 (PM 28 Oct 2026): a failed step left the session open, so
# the next flows stopped at signed-in-start. The hook runs after a pass OR a
# fail and discards the session only while it is still open (after a pass the
# flow's own discard already ended it).
# A one-time session dialog can hide the chrome, so it is dismissed first.
# An expanded Rest hides the chrome too (a stray "Did it" started one in the
# dfd9b85 640 dp re-runs), so it is minimised before the check. T-69 carry 1:
# a trainer switched to Personal is put back (restore-workspace needs a main
# page, so the Workout hub goes back to Today first).
onFlowComplete:
  - runFlow: ../subflows/dismiss-session-dialogs.yaml
  - runFlow:
      when:
        visible:
          id: "how-to-close"
      commands:
        - tapOn:
            id: "how-to-close"
  - runFlow: ../subflows/minimize-rest.yaml
  - runFlow:
      when:
        visible:
          id: "session-chrome"
      commands:
        - runFlow: ../subflows/discard-workout.yaml
  - runFlow:
      when:
        true: ${output.v2SwitchedToMember === true}
      commands:
        - runFlow:
            when:
              visible:
                id: "workout-back-today"
            commands:
              - tapOn:
                  id: "workout-back-today"
              - extendedWaitUntil:
                  visible:
                    id: "tab-Today|rail-Today"
                  timeout: 20000
  - runFlow: ../subflows/restore-workspace.yaml
---
- runFlow: ../subflows/signed-in-start.yaml
- runFlow: ../subflows/member-workspace.yaml
- runFlow: ../subflows/start-workout.yaml

# One chrome.
- assertVisible:
    id: "session-exit"
- assertVisible:
    id: "session-plan"
- assertVisible:
    id: "session-timer"
- assertVisible:
    id: "session-all"
- assertVisible:
    id: "set-editor"

# How to (only when the library has content for this exercise). DECLARED
# (T-69): moved before the steppers; it sits on the stage, which the stepper
# scrolls move off a short screen (the when-visible then skipped silently).
- runFlow:
    when:
      visible:
        id: "how-to-open"
    commands:
      - tapOn:
          id: "how-to-open"
      - extendedWaitUntil:
          visible:
            id: "how-to-close"
          timeout: 15000
      - tapOn:
          id: "how-to-close"
      - extendedWaitUntil:
          notVisible:
            id: "how-to-close"
          timeout: 5000
      - assertVisible:
          id: "set-editor"

# Steppers on the CURRENT set (the one live editor; weight optional: + only;
# reps + then − back down). Values are not saved until "Did it".
# T-69 (640 dp phone; DECLARED, was a plain tap): the weight + can sit under
# the pinned dock, so a plain tap landed on "Did it" and logged a set. Each
# stepper is scrolled to the centre of the screen before its tap.
- scrollUntilVisible:
    element:
      id: "set-weight-plus-.*"
      childOf:
        id: "set-editor"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "set-weight-plus-.*"
    childOf:
      id: "set-editor"
# The 640 dp phone: the reps stepper sits just below the fold.
- scrollUntilVisible:
    element:
      id: "set-reps-plus-.*"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "set-reps-plus-.*"
- tapOn:
    id: "set-reps-minus-.*"
# No set was logged: no Rest, and the dock still offers the current set's
# "Did it" (a stepper tap that reached the dock would have logged it).
- assertNotVisible:
    id: "rest-timer"
- assertVisible:
    id: "set-action-.*"
    text: "Did it"
    childOf:
      id: "session-dock"

# Browsing: Up next (when there is a later exercise) → bar, stats, nav; Resume.
- runFlow:
    when:
      visible:
        id: "up-next"
    commands:
      - tapOn:
          id: "up-next"
      - extendedWaitUntil:
          visible:
            id: "browsing-bar"
          timeout: 5000
      - assertVisible:
          id: "session-stats"
      - assertVisible:
          id: "exercise-nav"
      - tapOn:
          id: "browsing-resume"
      - extendedWaitUntil:
          notVisible:
            id: "browsing-bar"
          timeout: 5000

# Exit → Discard dialog; Keep going keeps the session. An expanded Rest
# would hide the Exit, so it is minimised first (a no-op without one).
- runFlow: ../subflows/minimize-rest.yaml
- tapOn:
    id: "session-exit"
- extendedWaitUntil:
    visible:
      id: "discard-dialog"
    timeout: 10000
- assertVisible:
    id: "discard-confirm"
- tapOn:
    id: "discard-keep"
- extendedWaitUntil:
    notVisible:
      id: "discard-dialog"
    timeout: 5000
- assertVisible:
    id: "session-chrome"

# Cleanup: discard the session this flow started.
- runFlow: ../subflows/discard-workout.yaml
# QA candidate-dfd9b85 carry 1: put a trainer back on the Trainer workspace
# (a no-op for a member). The Workout hub is an inner page, so back to Today.
- runFlow:
    when:
      true: ${output.v2SwitchedToMember === true}
    commands:
      - tapOn:
          id: "workout-back-today"
      - extendedWaitUntil:
          visible:
            id: "tab-Today|rail-Today"
          timeout: 20000
- runFlow: ../subflows/restore-workspace.yaml
