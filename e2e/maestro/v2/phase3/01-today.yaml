# v2 Phase 3 §2 Today (team 3a). Read-only. Starts signed in on a tab root
# (the lead's safe runner signs in first). Member QA account with an active
# plan. IDs only; no taps that write data.
appId: com.gymido.app
---
- tapOn:
    id: "tab-Today"
- extendedWaitUntil:
    visible:
      id: "home-header"
    timeout: 30000
- assertVisible:
    id: "home-date"
- assertVisible:
    id: "home-greeting"
- assertVisible:
    id: "home-today-card"
- assertVisible:
    id: "home-today-primary"
- assertVisible:
    id: "home-view-plan"
- assertVisible:
    id: "home-stats"
# QA s4: home-weight can stop with only its header peeking under the floating
# tab bar; scroll to the card's own button, centred, so the card is in view.
- scrollUntilVisible:
    element:
      id: "home-add-weight"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "home-weight"
- assertVisible:
    id: "home-see-progress"
- assertVisible:
    id: "home-add-weight"
# The week strip shows when the server has a current week (U1).
- runFlow:
    when:
      visible:
        id: "home-week"
    commands:
      - assertVisible:
          id: "home-week-strip"
# "See progress" opens Progress.
- tapOn:
    id: "home-see-progress"
- extendedWaitUntil:
    visible:
      id: "progress-tabs"
    timeout: 30000
