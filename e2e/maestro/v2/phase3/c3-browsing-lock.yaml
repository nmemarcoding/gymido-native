# Phase 3 batch 2 item 2 (browsing lock, web parity; SessionRuntime editorSet
# is null while browsing). In a fresh session: browse exercise 2 → no live set
# (no "Did it", no weight/reps inputs, no set buttons for its to-do sets);
# Resume → the live editor is back. Then log every set of exercise 1 (exercise
# 2 becomes active), browse exercise 1 → every set done, "Locked"; its done
# segment → "Undo set k" → exercise 1 is active again and the live editor returns. Ends by
# DISCARDING the session (the set PATCHes belong to the discarded session only).
#
# DECLARED (T-146, owner delegated OK 30 Oct; PM-approved E4/D-items): the
# phone has no per-exercise dashes ("Exercise n of m") and no strip chips any
# more. Markers now: the set card (set-editor) instead of set-strip; the end of
# exercise 1 = the rest after its last set ("Get ready for the next exercise!", its
# gold "Start now"); a browsed done set is undone through its done segment
# (set-segment-<id>) → "Undo set k" (set-undo-<id>; rev 40 + PM, web parity).
# Was: exercise-segments text "Exercise n of m", set-strip, a done chip
# "Undo", locked chips.
#
# Signed-in start (the lead's safe runner). Fixture: an ACTIVE plan whose
# session has 2+ exercises, whose first exercise has at most 10 sets (the
# logging loop's cap) and a rest time on its last set (rest 3). IDs only (plus
# the accessible names "Did it", "Undo set n", "Locked", "Skip Rest" and "Go to the
# next exercise" on id-matched or text nodes). Uses the v2 subflows
# (e2e/maestro/v2/subflows).
appId: com.gymido.app
tags:
  - member
---
# DECLARED (T-153, PM-approved): the phone rest is a sheet: marker "rest-ring-box|rest-sheet", minimise via the
# handle "rest-sheet-handle" (the tablet keeps rest-timer-minimize), copy "Get ready for the next exercise!" / "Skip Rest".
- runFlow: ../subflows/signed-in-start.yaml
- runFlow: ../subflows/start-workout.yaml
- runFlow: ../subflows/dismiss-session-dialogs.yaml
- extendedWaitUntil:
    visible:
      id: "session-chrome"
    timeout: 15000

# --- A. Browse exercise 2: no live set. ------------------------------------
- tapOn:
    id: "session-all"
- extendedWaitUntil:
    visible:
      id: "exercise-sheet"
    timeout: 10000
- tapOn:
    id: "exercise-sheet-card-1"
- extendedWaitUntil:
    notVisible:
      id: "exercise-sheet"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "browsing-bar"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "set-editor"
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertNotVisible:
    id: "set-action-.*"
- assertNotVisible:
    id: "set-weight-.*"
- assertNotVisible:
    id: "set-reps-.*"
- scrollUntilVisible:
    element:
      id: "browsing-resume"
    direction: UP
    timeout: 10000
- tapOn:
    id: "browsing-resume"
- extendedWaitUntil:
    notVisible:
      id: "browsing-bar"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "set-weight-.*"
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertVisible:
    id: "set-reps-.*"
- scrollUntilVisible:
    element:
      id: "set-action-.*"
      text: "Did it"
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertVisible:
    id: "set-action-.*"
    text: "Did it"
    enabled: true

# --- B. Log every set of exercise 1, until the rest after its last set. ----
- repeat:
    while:
      notVisible: "Get ready for the next exercise!"
    times: 10
    commands:
      - runFlow: ../subflows/log-current-set.yaml
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow: ../subflows/dismiss-session-dialogs.yaml
      # A mid-exercise rest: skip it (rest 3 has "Start now" instead and ends the loop).
      - runFlow:
          when:
            visible: "Skip Rest"
          commands:
            - tapOn:
                id: "rest-timer-skip"
            - extendedWaitUntil:
                notVisible:
                  id: "rest-timer"
                timeout: 5000
- extendedWaitUntil:
    visible: "Get ready for the next exercise!"
    timeout: 10000
- tapOn:
    id: "rest-timer-skip"
- extendedWaitUntil:
    notVisible:
      id: "rest-timer"
    timeout: 5000
- runFlow: ../subflows/dismiss-session-dialogs.yaml

# --- C. Browse exercise 1 (all done): Locked; Undo through a done segment. --
- scrollUntilVisible:
    element:
      id: "session-all"
    direction: UP
    timeout: 10000
- tapOn:
    id: "session-all"
- extendedWaitUntil:
    visible:
      id: "exercise-sheet"
    timeout: 10000
- tapOn:
    id: "exercise-sheet-card-0"
- extendedWaitUntil:
    notVisible:
      id: "exercise-sheet"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "browsing-bar"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "set-editor"
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertVisible:
    id: "set-locked"
- assertNotVisible:
    id: "set-weight-.*"
- assertNotVisible:
    id: "set-action-.*"
    text: "Did it"
# Undo one done set of the browsed exercise: its segment, then "Undo set n".
- tapOn:
    id: "set-segment-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "set-undo-.*"
    timeout: 5000
- tapOn:
    id: "set-undo-.*"
    text: "Undo set .*"
    enabled: true
# Exercise 1 has a pending set again, so it is the active exercise: the view
# is live (no browsing bar) with the editor on the undone set.
- extendedWaitUntil:
    notVisible:
      id: "browsing-bar"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "set-weight-.*"
    direction: DOWN
    centerElement: true
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "set-action-.*"
      text: "Did it"
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertVisible:
    id: "set-action-.*"
    text: "Did it"
    enabled: true

# Cleanup: discard the session this flow started.
- scrollUntilVisible:
    element:
      id: "session-exit"
    direction: UP
    timeout: 10000
- runFlow: ../subflows/discard-workout.yaml
