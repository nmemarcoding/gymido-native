# Phase 3 §4 (UX F2) Rest: logs the first set of a fresh session, then checks
# the v2 Rest screen (ring, "of m:ss", ±5 s, Next card when there is a next
# set), minimise → the disc, tap → expanded again, Skip rest closes it. Ends
# by DISCARDING the session (nothing is recorded server-side except the one
# set PATCH of the discarded session).
#
# Signed-in start (the lead's safe runner). Fixture: an ACTIVE plan whose
# first set has a planned rest > 0 s. IDs only. Uses the v2 subflows from the
# h2 backfill (e2e/maestro/v2/subflows); not run by team 3c (no devices).
appId: com.gymido.app
tags:
  - member
---
# DECLARED (T-153, PM-approved): the phone rest is a sheet: marker "rest-ring-box|rest-sheet", minimise via the
# handle "rest-sheet-handle" (the tablet keeps rest-timer-minimize), copy "Get ready for the next exercise!" / "Skip Rest".
# DECLARED (T-146, PM-approved): the expanded-Rest marker "rest-ring-box" is now "rest-ring-box|rest-sheet"
# (the phone Rest has no ring; the tablet keeps it).
- runFlow: ../subflows/signed-in-start.yaml
- runFlow: ../subflows/start-workout.yaml
- runFlow: ../subflows/dismiss-session-dialogs.yaml
# Weight + (centred), then "Did it" only (in the card since T-132, scrolled to)
# (never a strip chip's Undo), with the session dialogs dismissed before and
# after the tap (T-69 / T-82; DECLARED, was a plain weight tap + any enabled
# set-action-.*).
- runFlow: ../subflows/log-current-set.yaml
- extendedWaitUntil:
    visible:
      id: "rest-ring-box|rest-sheet"
    timeout: 15000
- assertVisible:
    id: "rest-countdown"
- assertVisible:
    id: "rest-timer-skip"
# +5 s grows the total; the screen stays open. DECLARED (T-146): the "of m:ss" check (rest-total) is gone with the
# phone ring (A4).
- tapOn:
    id: "rest-timer-plus"
- assertVisible:
    id: "rest-ring-box|rest-sheet"
# Minimise → the disc over the live workout.
- tapOn:
    id: "rest-timer-minimize|rest-sheet-handle"
- extendedWaitUntil:
    notVisible:
      id: "rest-ring-box|rest-sheet"
    timeout: 5000
- assertVisible:
    id: "rest-timer"
- assertVisible:
    id: "session-chrome"
# Tap the disc → the full Rest again.
- tapOn:
    id: "rest-timer"
- extendedWaitUntil:
    visible:
      id: "rest-ring-box|rest-sheet"
    timeout: 5000
# Skip rest clears it.
- tapOn:
    id: "rest-timer-skip"
- extendedWaitUntil:
    notVisible:
      id: "rest-timer"
    timeout: 5000
- assertVisible:
    id: "session-chrome"
- runFlow: ../subflows/discard-workout.yaml
