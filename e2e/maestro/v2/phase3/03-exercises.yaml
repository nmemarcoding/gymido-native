# v2 Phase 3 §5 Exercises (team 3a). Read-only. Starts signed in on a tab root.
# T-62 (QA candidate-9643e9c flow defect): the muscle chips are gone. A phone
# or a < 1024 tablet has the Filter button + sheet; ≥ 1024 has the panel.
appId: com.gymido.app
---
- extendedWaitUntil:
    visible:
      id: "tab-Exercises|rail-Exercises"
    timeout: 30000
# Phone tab bar or the tablet rail (flow run ea27f77).
- runFlow:
    when:
      visible:
        id: "tab-Exercises"
    commands:
      - tapOn:
          id: "tab-Exercises"
- runFlow:
    when:
      visible:
        id: "rail-Exercises"
    commands:
      - tapOn:
          id: "rail-Exercises"
- extendedWaitUntil:
    visible:
      id: "exercises-bar"
    timeout: 60000
- assertVisible:
    id: "exercises-search"
- extendedWaitUntil:
    visible:
      id: "exercises-filter|exercises-filter-panel"
    timeout: 30000
- assertVisible:
    id: "exercises-result-count"
# The Filter button opens the sheet with its Muscle group section; × closes it.
- runFlow:
    when:
      visible:
        id: "exercises-filter"
    commands:
      - tapOn:
          id: "exercises-filter"
      - extendedWaitUntil:
          visible:
            id: "exercise-filter-sheet"
          timeout: 10000
      - assertVisible:
          id: "exercise-filter-find"
      - assertVisible:
          id: "exercise-filter-section-muscle"
      # QA candidate-9643e9c "Automate:": a find text with no match.
      - tapOn:
          id: "exercise-filter-find"
      - inputText: "zzqq"
      - extendedWaitUntil:
          visible:
            id: "exercise-filter-no-match"
          timeout: 10000
      - eraseText: 10
      - tapOn:
          id: "app-modal-close"
      - extendedWaitUntil:
          notVisible:
            id: "exercise-filter-sheet"
          timeout: 10000
# ≥ 1024: the always-visible panel with the same section.
- runFlow:
    when:
      visible:
        id: "exercises-filter-panel"
    commands:
      - assertVisible:
          id: "exercise-filter-find"
      - assertVisible:
          id: "exercise-filter-section-muscle"
      # QA candidate-9643e9c "Automate:": a find text with no match.
      - tapOn:
          id: "exercise-filter-find"
      - inputText: "zzqq"
      - extendedWaitUntil:
          visible:
            id: "exercise-filter-no-match"
          timeout: 10000
      - eraseText: 10
- assertVisible:
    id: "exercises-list"
