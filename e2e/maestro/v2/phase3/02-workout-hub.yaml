# v2 Phase 3 §5 Workout hub (team 3a). Read-only: never taps Start (that
# would create a session). Starts signed in on a tab root; member with an
# active plan and no running session.
appId: com.gymido.app
---
# QA LOW (2.0.5 regression): an earlier flow can end on an inner page (no tab
# bar since T-65), so start from the shared entry (a Release build relaunches
# onto the role's main page) instead of waiting for a tab bar.
- runFlow: ../subflows/signed-in-start.yaml
- extendedWaitUntil:
    visible:
      id: "tab-Today|rail-Today"
    timeout: 30000
# Phone tab bar or the tablet rail (flow run ea27f77).
- runFlow:
    when:
      visible:
        id: "tab-Today"
    commands:
      - tapOn:
          id: "tab-Today"
- runFlow:
    when:
      visible:
        id: "rail-Today"
    commands:
      - tapOn:
          id: "rail-Today"
# QA candidate-9643e9c: Today keeps its scroll position (01-today ends at
# the weight card), so scroll back up to the top state first.
- scrollUntilVisible:
    element:
      id: "home-today-primary|home-empty-hero|home-error"
    direction: UP
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "home-today-primary"
    timeout: 30000
- tapOn:
    id: "home-today-primary"
- extendedWaitUntil:
    visible:
      id: "workout-title"
    timeout: 30000
- assertVisible:
    id: "workout-back-today"
# DECLARED (T-140, PM-approved): was workout-hero / workout-plan-name /
# workout-other-days (the retired hub). Now the week card, the plan line and
# the 7-day strip, present in every state with a scheduled plan.
- assertVisible:
    id: "workout-week-card"
- assertVisible:
    id: "workout-plan-line"
- scrollUntilVisible:
    element:
      id: "workout-days"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "workout-back-today"
    direction: UP
    timeout: 20000
# U5: "← Today" returns to Today.
- tapOn:
    id: "workout-back-today"
- extendedWaitUntil:
    visible:
      id: "home-today-card"
    timeout: 30000
