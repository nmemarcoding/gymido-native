# v2 Phase 3 §5 Workout hub (team 3a). Read-only: never taps Start (that
# would create a session). Starts signed in on a tab root; member with an
# active plan and no running session.
appId: com.gymido.app
---
- extendedWaitUntil:
    visible:
      id: "tab-Today|rail-Today"
    timeout: 30000
# Phone tab bar or the tablet rail (flow run ea27f77).
- runFlow:
    when:
      visible:
        id: "tab-Today"
    commands:
      - tapOn:
          id: "tab-Today"
- runFlow:
    when:
      visible:
        id: "rail-Today"
    commands:
      - tapOn:
          id: "rail-Today"
# QA candidate-9643e9c: Today keeps its scroll position (01-today ends at
# the weight card), so scroll back up to the top state first.
- scrollUntilVisible:
    element:
      id: "home-today-primary|home-empty-hero|home-error"
    direction: UP
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "home-today-primary"
    timeout: 30000
- tapOn:
    id: "home-today-primary"
- extendedWaitUntil:
    visible:
      id: "workout-title"
    timeout: 30000
- assertVisible:
    id: "workout-back-today"
- assertVisible:
    id: "workout-hero"
# T-76 (DECLARED): was workout-hero-badge + workout-hero-detail (the retired
# hero's status pill and detail line). Now the plan name under the title and
# the Other days block, present in every state with a plan.
- assertVisible:
    id: "workout-plan-name"
- scrollUntilVisible:
    element:
      id: "workout-other-days"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "workout-back-today"
    direction: UP
    timeout: 20000
# U5: "← Today" returns to Today.
- tapOn:
    id: "workout-back-today"
- extendedWaitUntil:
    visible:
      id: "home-today-card"
    timeout: 30000
