appId: com.gymido.app
---
- extendedWaitUntil: { visible: { id: "tab-Progress|rail-Progress" }, timeout: 30000 }
- runFlow: { when: { visible: { id: "tab-Progress" } }, commands: [ { tapOn: { id: "tab-Progress" } } ] }
- runFlow: { when: { visible: { id: "rail-Progress" } }, commands: [ { tapOn: { id: "rail-Progress" } } ] }
- tapOn: { id: "progress-tab-activity" }
- scrollUntilVisible: { element: { id: "progress-recent" }, direction: DOWN, timeout: 20000 }
- scrollUntilVisible: { element: { text: "Full Body C" }, direction: DOWN, centerElement: true, timeout: 20000 }
- runFlow: { file: c-one.yaml, env: { CANCEL_FIRST: "yes" } }
- runFlow: { file: c-one.yaml, env: { CANCEL_FIRST: "no" } }
- assertVisible: "Full.Body.C"
