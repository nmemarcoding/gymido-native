# Phase 4 §1 (H): Plans → a catalog plan → Plan detail → back to Plans.
# READ-ONLY: never taps Start workout plan / Update schedule / Copy.
# Starts signed in on a tab root (the lead's safe runner signs in first).
# IDs only, no coordinates, no credentials, no screenshots.
appId: com.gymido.app
---
# QA candidate 2941880 (PM 28 Oct 2026): since T-65 the flow before this one
# can end on an inner page (no tab bar), so start from a main page.
- runFlow: ../subflows/signed-in-start.yaml
# Phone bottom tab or the tablet rail (QA T-60 flow defect).
- runFlow:
    when:
      visible:
        id: "tab-Plans"
    commands:
      - tapOn:
          id: "tab-Plans"
- runFlow:
    when:
      visible:
        id: "rail-Plans"
    commands:
      - tapOn:
          id: "rail-Plans"
- extendedWaitUntil:
    visible:
      id: "plans-library-screen"
    timeout: 30000
# Flow run ea27f77: on a phone with an active plan the entry rows sit below
# the plan card; scroll down to them. Final batch (27 Oct 2026): the T-60
# tablet draws the own rows too; the old tablet tiles are gone.
- scrollUntilVisible:
    element:
      id: "plans-own"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "my-plans-entry"
- scrollUntilVisible:
    element:
      id: "plans-card-.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "plans-card-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "plan-detail-back"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "plan-schedule-card"
    direction: DOWN
    timeout: 20000
# Flow run ea27f77 (tablet): the button sits below the card's top.
- scrollUntilVisible:
    element:
      id: "plan-activate"
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: "plan-activate"
- scrollUntilVisible:
    element:
      id: "plan-detail-back"
    direction: UP
    timeout: 20000
- tapOn:
    id: "plan-detail-back"
- extendedWaitUntil:
    visible:
      id: "plans-library-screen"
    timeout: 30000
