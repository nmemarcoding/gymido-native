# Phase 4 §1 (H): the active plan card → View plan → Plan detail as the
# current plan ("Current plan" pill; "This week" when the BE sends statuses).
# Skips cleanly when the QA member has no active plan. READ-ONLY: never taps
# Go to workout, the Today Start, Update schedule or Copy. IDs only.
appId: com.gymido.app
---
# Phone bottom tab or the tablet rail (QA T-60 flow defect).
- runFlow:
    when:
      visible:
        id: "tab-Plans"
    commands:
      - tapOn:
          id: "tab-Plans"
- runFlow:
    when:
      visible:
        id: "rail-Plans"
    commands:
      - tapOn:
          id: "rail-Plans"
- extendedWaitUntil:
    visible:
      id: "plans-library-screen"
    timeout: 30000
# Flow run ea27f77: on a phone with an active plan the entry rows sit below
# the plan card; scroll down to them.
- scrollUntilVisible:
    element:
      id: "plans-entry-tiles|plans-own"
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "plans-active-card"
    commands:
      # Tablet card: Go to workout + View plan. Phone card (T-60): Start +
      # See full plan. Neither Go to workout nor Start is ever tapped.
      - runFlow:
          when:
            visible:
              id: "plans-view-active"
          commands:
            - assertVisible:
                id: "plans-go-to-workout"
            - tapOn:
                id: "plans-view-active"
      - runFlow:
          when:
            visible:
              id: "plans-see-full-plan"
          commands:
            - assertVisible:
                id: "plans-start"
            - tapOn:
                id: "plans-see-full-plan"
      - extendedWaitUntil:
          visible:
            id: "plan-detail-current"
          timeout: 30000
      - runFlow:
          when:
            visible:
              id: "plan-this-week"
          commands:
            - assertVisible:
                id: "plan-this-week"
      - scrollUntilVisible:
          element:
            id: "plan-schedule-card"
          direction: DOWN
          timeout: 20000
      - scrollUntilVisible:
          element:
            id: "plan-detail-back"
          direction: UP
          timeout: 20000
      - tapOn:
          id: "plan-detail-back"
      - extendedWaitUntil:
          visible:
            id: "plans-library-screen"
          timeout: 30000
