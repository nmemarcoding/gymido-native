# v2 Phase 4 §3 Generator (team 4j): save the answers and open the preview;
# check the sticky row, open an exercise, come back. NEVER taps "Start this
# plan" (that would replace the QA member's plan). Saves the generator
# profile only (PUT /plan-generator/profile). Starts signed in on a tab root.
# QA s5-p4: before every Next (and See plan) the flow scrolls the button to the
# middle of the screen (centerElement) so it is never under the floating tab
# bar; the review opens at its TOP (G1.3), so generator-review-1 shows at once.
appId: com.gymido.app
---
- tapOn:
    id: "tab-Plans"
- scrollUntilVisible:
    element:
      id: "generator-entry-start"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "generator-entry-start"
- extendedWaitUntil:
    visible:
      id: "generator-progress"
    timeout: 30000
# Deep-link-free path: the saved profile pre-fills the answers; walk Next.
- tapOn:
    id: "generator-goal-BUILD_MUSCLE"
# Steps 1 → 6 take five Nexts and step 6 → the Review a sixth (QA's "the
# Review keeps step 6's offset" was this off-by-one: the flow never left step 6).
- repeat:
    times: 6
    commands:
      - scrollUntilVisible:
          element:
            id: "generator-next"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - tapOn:
          id: "generator-next"
# G1.3: the Review opens at its TOP — the title is on screen with no scroll.
- extendedWaitUntil:
    visible:
      id: "generator-review-title"
    timeout: 15000
- assertVisible:
    id: "generator-review-1"
- extendedWaitUntil:
    visible:
      id: "generator-review-1"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "generator-see-plan"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "generator-see-plan"
# Feasible (the usual QA case) or the refusal card.
- extendedWaitUntil:
    visible:
      id: "generator-plan-name"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        id: "generator-plan-name"
    commands:
      - assertVisible:
          id: "generator-sticky-row"
      - assertVisible:
          id: "generator-bar-change"
      # The 640 dp phone: Day 1 sits under the plan notes, behind the bar.
      - scrollUntilVisible:
          element:
            id: "generator-day-1"
          direction: DOWN
          centerElement: true
          timeout: 15000
      - assertVisible:
          id: "generator-day-1"
      # Back to the answers with the phone back icon button (it scrolls with
      # the content, so back up to it after the Day 1 scroll).
      - scrollUntilVisible:
          element:
            id: "generator-preview-back"
          direction: UP
          timeout: 15000
      - tapOn:
          id: "generator-preview-back"
      # DECLARED (QA candidate 2941880, PM 28 Oct 2026): was "back on the
      # review, scroll UP to generator-review-1". By the G1 design (review M1)
      # "Back to your answers" pushes a FRESH questionnaire at Step 1, seeded
      # from the saved generator profile (so the goal picked above stays
      # chosen). DECLARED (640 dp confirm, 28 Oct): the dfd9b85 check
      # `generator-goal-BUILD_MUSCLE checked: false` is removed (it contradicts
      # that seeding); Step 1 is proven by its goal rows + the Step 1 hint,
      # which sits below the fold on a 640 dp phone (scroll to it).
      - extendedWaitUntil:
          visible:
            id: "generator-goal-BUILD_MUSCLE"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "generator-step1-hint"
          direction: DOWN
          timeout: 15000
- runFlow:
    when:
      visible:
        id: "generator-not-feasible"
    commands:
      - assertVisible:
          id: "generator-not-feasible-title"
