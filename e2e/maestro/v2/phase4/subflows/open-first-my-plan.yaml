# Phase 4 §2 (4i): from the signed-in tab root to the builder of the
# member's first own plan. IDs only. Needs a QA member with at least one
# plan in My plans that has a day with an exercise.
appId: com.gymido.app
---
- extendedWaitUntil:
    visible:
      id: "tab-Plans"
    timeout: 60000
- tapOn:
    id: "tab-Plans"
- extendedWaitUntil:
    visible:
      id: "my-plans-entry"
    timeout: 30000
- tapOn:
    id: "my-plans-entry"
- extendedWaitUntil:
    visible:
      id: "my-plan-card-open-.*"
      index: 0
    timeout: 30000
- tapOn:
    id: "my-plan-card-open-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "plan-all-plans"
    timeout: 30000
