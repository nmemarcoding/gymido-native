# Phase 4 §2 (4i): from the signed-in tab root to the builder of the
# member's first own plan. IDs only. Needs a QA member WITHOUT a trainer
# with at least one plan in My plans that has a day with an exercise.
# QA s5-p4: a member WITH a trainer sees "Your plans are on hold"
# (my-plans-on-hold); this subflow then FAILS FAST with a precondition
# message (no silent skip: a skip would report a false PASS).
appId: com.gymido.app
---
# QA LOW (2.0.5 regression): an earlier flow can end on an inner page (no tab
# bar since T-65), so start from the shared entry (a Release build relaunches
# onto the role's main page) instead of waiting for a tab bar.
- runFlow: ../../subflows/signed-in-start.yaml
# Phone bottom tabs or the tablet rail.
- extendedWaitUntil:
    visible:
      id: "tab-Plans|rail-Plans"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "tab-Plans"
    commands:
      - tapOn:
          id: "tab-Plans"
- runFlow:
    when:
      visible:
        id: "rail-Plans"
    commands:
      - tapOn:
          id: "rail-Plans"
# 2.0.7 device check: with an active catalog plan the Plans page shows the
# plan card + week first and "My plans" sits below the fold; scroll to it.
- scrollUntilVisible:
    element:
      id: "my-plans-entry"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn:
    id: "my-plans-entry"
- extendedWaitUntil:
    visible:
      id: "my-plan-card-open-.*|my-plans-on-hold"
      index: 0
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "my-plans-on-hold"
    commands:
      - assertTrue:
          condition: ${false}
          label: "Precondition: needs a member WITHOUT a trainer who owns a plan; sign in as THROWAWAY4 after CP12"
- runFlow:
    when:
      notVisible:
        id: "my-plans-on-hold"
    commands:
      - tapOn:
          id: "my-plan-card-open-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "plan-all-plans"
          timeout: 30000
