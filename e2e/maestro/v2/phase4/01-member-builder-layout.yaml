# Phase 4 §2 (4i): the member builder's v2 layout. Read-only.
# Phone: back link, overflow, day tabs, selected-day strip; tablet: the
# days card and inline actions. Starts signed in on the tab root (QA member).
# Account: a member WITHOUT a trainer who OWNS a plan (with a day that has an
# exercise), e.g. THROWAWAY4 right after CP12. With a trainer, My plans shows
# "Your plans are on hold" (my-plans-on-hold): the flow then FAILS FAST with a
# precondition message (never a silent skip, which would be a false PASS).
appId: com.gymido.app
---
- runFlow: subflows/open-first-my-plan.yaml
# Precondition: a member WITHOUT a trainer who owns a plan (THROWAWAY4 after CP12).
- runFlow:
    when:
      notVisible:
        id: "my-plans-on-hold"
    commands:
      - assertVisible:
          id: "plan-day-[0-9]+"
          index: 0
      - runFlow:
          when:
            visible:
              id: "plan-day-tabs"
          commands:
            - tapOn:
                id: "plan-day-[0-9]+"
                index: 0
            - assertVisible:
                id: "plan-overflow"
      - runFlow:
          when:
            visible:
              id: "plan-days-card"
          commands:
            - assertVisible:
                id: "plan-edit-details"
            - assertVisible:
                id: "plan-make-copy"
      - assertVisible:
          id: "plan-add-exercise"
