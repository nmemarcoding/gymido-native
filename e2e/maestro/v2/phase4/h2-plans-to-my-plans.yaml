# Phase 4 §1 (H): Plans → My plans (the entry tile) → "← All plans" back.
# READ-ONLY: never taps Create a plan / Build me a plan / Open.
# Starts signed in on a tab root. IDs only.
appId: com.gymido.app
---
# Phone bottom tab or the tablet rail (QA T-60 flow defect).
- runFlow:
    when:
      visible:
        id: "tab-Plans"
    commands:
      - tapOn:
          id: "tab-Plans"
- runFlow:
    when:
      visible:
        id: "rail-Plans"
    commands:
      - tapOn:
          id: "rail-Plans"
- extendedWaitUntil:
    visible:
      id: "plans-library-screen"
    timeout: 30000
# Flow run ea27f77: on a phone with an active plan the entry rows sit below
# the plan card; scroll down to them. Final batch (27 Oct 2026): the T-60
# tablet draws the own rows too; the old tablet tiles are gone.
- scrollUntilVisible:
    element:
      id: "plans-own"
    direction: DOWN
    timeout: 20000
# QA candidate-9643e9c: on Android the entry is below the fold, and on iOS a
# tap while the scroll still moves is lost. Scroll it in, then let it settle.
- scrollUntilVisible:
    element:
      id: "my-plans-entry"
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "my-plans-entry"
- extendedWaitUntil:
    visible:
      id: "my-plans-all-plans"
    timeout: 30000
# Either the list/empty state with the actions, or the on-hold box.
- runFlow:
    when:
      notVisible:
        id: "my-plans-on-hold"
    commands:
      - extendedWaitUntil:
          visible:
            id: "my-plans-create"
          timeout: 30000
- tapOn:
    id: "my-plans-all-plans"
- extendedWaitUntil:
    visible:
      id: "plans-library-screen"
    timeout: 30000
