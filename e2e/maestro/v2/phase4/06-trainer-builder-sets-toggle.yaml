# Phase 4 §2 / Phase 6 §3 (4i): the trainer builder (header card, teal chip,
# day tabs) and the "Sets" display toggle (collapse, expand). Read-only.
# Starts signed in as the QA trainer (with at least one trainer plan) on the
# tab root. QA s5-p4: switches to the trainer workspace first
# (subflows/trainer-workspace, like 6n/6o), opens the trainer Plans tab
# (tab-TPlans on a phone, rail-TPlans on a tablet) and restores the
# workspace at the end (subflows/restore-workspace).
appId: com.gymido.app
---
- extendedWaitUntil:
    visible:
      id: "tab-Today|rail-Today|tab-TToday|rail-TToday"
    timeout: 60000
- runFlow: ../subflows/trainer-workspace.yaml
- runFlow:
    when:
      visible:
        id: "tab-TPlans"
    commands:
      - tapOn:
          id: "tab-TPlans"
- runFlow:
    when:
      visible:
        id: "rail-TPlans"
    commands:
      - tapOn:
          id: "rail-TPlans"
- extendedWaitUntil:
    visible:
      id: "plan-card-view-.*"
      index: 0
    timeout: 30000
- tapOn:
    id: "plan-card-view-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "plan-eyebrow-chip"
    timeout: 30000
- assertVisible:
    id: "plan-header-card"
- runFlow:
    when:
      visible:
        id: "plan-exercise-sets-.*"
        index: 0
    commands:
      - tapOn:
          id: "plan-exercise-sets-.*"
          index: 0
      - tapOn:
          id: "plan-exercise-sets-.*"
          index: 0
- assertVisible:
    id: "plan-all-plans"
# T-65 (27 Oct 2026): the builder has no tab bar on phones; back to the Plans list (a main page) before the restore.
- tapOn:
    id: "plan-all-plans"
- extendedWaitUntil:
    visible:
      id: "plans-create"
    timeout: 30000
- runFlow: ../subflows/restore-workspace.yaml
