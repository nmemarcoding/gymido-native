# Phase 4 §2 (4i): the phone overflow lists the plan actions; "Edit details"
# opens the Plan details sheet (approved placeholder), Cancel closes it.
# Tablet: the inline "Edit details". Nothing is saved.
# Account: a member WITHOUT a trainer who OWNS a plan (with a day that has an
# exercise), e.g. THROWAWAY4 right after CP12. With a trainer, My plans shows
# "Your plans are on hold" (my-plans-on-hold): the flow then skips SILENTLY.
appId: com.gymido.app
---
- runFlow: subflows/open-first-my-plan.yaml
# Skipped silently when the member's own plans are on hold (has a trainer).
- runFlow:
    when:
      notVisible:
        id: "my-plans-on-hold"
    commands:
      - runFlow:
          when:
            visible:
              id: "plan-overflow"
          commands:
            - tapOn:
                id: "plan-overflow"
            - extendedWaitUntil:
                visible:
                  id: "plan-overflow-sheet"
                timeout: 10000
            - assertVisible:
                id: "plan-overflow-make-copy"
            - assertVisible:
                id: "plan-overflow-delete"
            - tapOn:
                id: "plan-overflow-edit-details"
      - runFlow:
          when:
            notVisible:
              id: "edit-plan-modal"
          commands:
            - tapOn:
                id: "plan-edit-details"
      - extendedWaitUntil:
          visible:
            id: "edit-plan-modal"
          timeout: 10000
      - assertVisible:
          id: "edit-plan-days"
      - assertVisible:
          id: "edit-plan-save"
      - tapOn:
          id: "edit-plan-cancel"
      - assertNotVisible:
          id: "edit-plan-modal"
