      id: "bridge-build"
    timeout: 30000
- tapOn:
    id: "bridge-build"
- extendedWaitUntil:
    visible:
      id: "generator-cancel"
    timeout: 30000
- tapOn:
    id: "generator-cancel"
- extendedWaitUntil:
    visible:
      id: "tab-Today|rail-Today|desktop-sidebar"
    timeout: 30000
