# T-113 (owner, replaces the T-102 / T-108 Missed card; DECLARED rewrite, owner OK 29 Oct via PM): a rest day with
# an open miss is the normal Rest hero + ONE Catch-up row on Today and Workout; Workout's "Train anyway?" lists the
# misses first; the row → the T-80 confirm (rest copy) → Start → a live session, which is then discarded (nothing
# recorded). Starts signed in as a member on a REST day with an open miss. Throwaway accounts only; IDs + patterns,
# no credentials, no Profile shots.
appId: com.gymido.app
---
- runFlow: ../subflows/signed-in-start.yaml
- runFlow: { when: { visible: { id: "tab-Today" } }, commands: [ { tapOn: { id: "tab-Today" } } ] }
- runFlow: { when: { visible: { id: "rail-Today" } }, commands: [ { tapOn: { id: "rail-Today" } } ] }
- extendedWaitUntil: { visible: { id: "home-today-card" }, timeout: 30000 }
- assertVisible: "Rest day"
- assertNotVisible: "You missed .*"
- assertNotVisible: "Do it now"
- assertNotVisible: { id: "home-today-eyebrow" }
- assertVisible: { id: "home-catch-up" }
- takeScreenshot: ${SHOT}-today
- tapOn: { id: "home-today-primary" }
- extendedWaitUntil: { visible: { id: "workout-hero" }, timeout: 30000 }
- assertNotVisible: { id: "session-chrome" }
- assertVisible: "Rest day"
- assertVisible: "Recovery is part of the plan.*"
- assertNotVisible: { id: "workout-missed-headline" }
- assertVisible: { id: "workout-catch-up" }
- takeScreenshot: ${SHOT}-workout
- scrollUntilVisible: { element: { text: "Train anyway\\?" }, direction: DOWN, centerElement: true, timeout: 20000 }
# iOS exposes a row as its one SR label (the meta text is pinned in jest).
- assertVisible: "Start .*, missed .*day"
- takeScreenshot: ${SHOT}-workout-train-anyway
- scrollUntilVisible: { element: { id: "workout-catch-up" }, direction: UP, centerElement: true, timeout: 20000 }
- tapOn: { id: "workout-catch-up" }
- extendedWaitUntil: { visible: { id: "workout-start-confirm" }, timeout: 10000 }
- assertVisible: "Catch up on .*\\?"
- assertVisible: "You missed it on .*day\\. Today is a rest day\\. This starts a live workout\\."
- takeScreenshot: ${SHOT}-workout-confirm
- tapOn: { id: "workout-start-confirm-confirm" }
- extendedWaitUntil: { visible: { id: "session-chrome" }, timeout: 30000 }
- runFlow: ../subflows/discard-workout.yaml
