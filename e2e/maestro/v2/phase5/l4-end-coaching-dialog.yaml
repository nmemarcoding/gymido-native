# v2 Phase 5 L (p5l): My trainer → End coaching → the confirm dialog → Cancel.
# Member QA account WITH an active trainer (FAILS FAST with a precondition
# message otherwise; never a silent skip),
# starts signed in on the tab root. Never confirms (no DELETE /my-trainer).
appId: com.gymido.app
---
- extendedWaitUntil:
    visible:
      id: "tab-Profile|rail-Profile"
    timeout: 60000
# Phone tab bar or the tablet rail (flow run ea27f77).
- runFlow:
    when:
      visible:
        id: "tab-Profile"
    commands:
      - tapOn:
          id: "tab-Profile"
- runFlow:
    when:
      visible:
        id: "rail-Profile"
    commands:
      - tapOn:
          id: "rail-Profile"
- extendedWaitUntil:
    visible:
      id: "profile-coaching-card"
    timeout: 30000
- tapOn:
    id: "profile-coaching-card"
- extendedWaitUntil:
    visible:
      id: "trainer-hub-screen"
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: "trainer-hub-end"
    commands:
      - assertTrue:
          condition: ${false}
          label: "Precondition: needs a member WITH an active trainer (QA_MEMBER while linked to QA_TRAINER)"
# QA candidate-9643e9c "Automate:": a member never sees a trainer's email.
- assertNotVisible: ".*@.*"
- runFlow:
    when:
      visible:
        id: "trainer-hub-end"
    commands:
      - tapOn:
          id: "trainer-hub-end"
      - extendedWaitUntil:
          visible:
            id: "trainer-hub-end-dialog"
          timeout: 10000
      - assertVisible:
          id: "trainer-hub-end-dialog-confirm"
      - tapOn:
          id: "trainer-hub-end-dialog-cancel"
      - extendedWaitUntil:
          notVisible:
            id: "trainer-hub-end-dialog"
          timeout: 10000
