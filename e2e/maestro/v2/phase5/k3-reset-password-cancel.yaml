# T-32 H1 Reset password (v2 look): the Change Password row opens the reset
# email dialog; Cancel closes it. Never taps "Send reset email", so no mail is
# sent. Google-only accounts have the static row instead and skip this.
appId: com.gymido.app
---
- runFlow: k-subflows/open-profile.yaml
- scrollUntilVisible:
    element:
      id: "settings-change-password"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "settings-change-password"
- extendedWaitUntil:
    visible:
      id: "change-password-submit"
    timeout: 20000
- assertVisible:
    id: "change-password-body"
- tapOn:
    id: "change-password-cancel"
- assertNotVisible:
    id: "change-password-submit"
- assertVisible:
    id: "settings-change-password"
