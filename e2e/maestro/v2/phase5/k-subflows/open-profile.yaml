# Phase 5 K: open the member Profile tab root. Starts signed in on a tab root
# (the lead's safe runner signs in first). A trainer account is moved to the
# Personal workspace first, or the member Profile tab never appears.
# IDs only; never screenshot Profile (account data).
appId: com.gymido.app
---
# Phone tab bar or the tablet rail (flow run ea27f77).
- runFlow:
    when:
      visible:
        id: "tab-TProfile"
    commands:
      - tapOn:
          id: "tab-TProfile"
- runFlow:
    when:
      visible:
        id: "rail-TProfile"
    commands:
      - tapOn:
          id: "rail-TProfile"
- runFlow:
    when:
      visible:
        id: "mode-switch-member"
    commands:
      - tapOn:
          id: "mode-switch-member"
- extendedWaitUntil:
    visible:
      id: "tab-Profile|rail-Profile"
    timeout: 60000
# Phone tab bar or the tablet rail (flow run ea27f77).
- runFlow:
    when:
      visible:
        id: "tab-Profile"
    commands:
      - tapOn:
          id: "tab-Profile"
- runFlow:
    when:
      visible:
        id: "rail-Profile"
    commands:
      - tapOn:
          id: "rail-Profile"
# QA s6 (k4/k5): re-tapping the active tab doesn't scroll to the top, and an
# earlier flow can leave Profile scrolled down. Scroll UP to the top row.
- scrollUntilVisible:
    element:
      id: "settings-display-name"
    direction: UP
    timeout: 30000
