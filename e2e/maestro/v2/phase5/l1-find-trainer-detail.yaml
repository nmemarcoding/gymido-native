# v2 Phase 5 L (p5l): Profile → Coaching → Find a trainer → Trainer detail →
# "← All trainers". Account: THROWAWAY3 (a member WITHOUT a trainer; QA_MEMBER
# now has one), signed in on the tab root (android-sign-in.sh / ios-safe-sign-in.sh). Read-only: the request dialog is opened and
# CANCELLED, never sent. IDs only.
appId: com.gymido.app
---
- extendedWaitUntil:
    visible:
      id: "tab-Profile"
    timeout: 60000
- tapOn:
    id: "tab-Profile"
# QA s6: Profile may be left scrolled down by an earlier flow.
- scrollUntilVisible:
    element:
      id: "profile-coaching-card"
    direction: UP
    timeout: 30000
- tapOn:
    id: "profile-coaching-card"
- extendedWaitUntil:
    visible:
      id: "trainer-hub-screen"
    timeout: 30000
# QA s6 (l1): "Browse trainers" exists only for a member with NO trainer.
- runFlow:
    when:
      notVisible:
        id: "trainer-hub-browse"
    commands:
      - assertTrue:
          condition: ${false}
          label: "l1 needs a member WITHOUT a trainer: sign in as THROWAWAY3"
- tapOn:
    id: "trainer-hub-browse"
- extendedWaitUntil:
    visible:
      id: "trainers-screen"
    timeout: 30000
- assertVisible:
    id: "trainers-heading"
- assertVisible:
    id: "trainers-search"
- extendedWaitUntil:
    visible:
      id: "trainers-card-.*"
    timeout: 30000
- tapOn:
    id: "trainers-card-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "trainer-detail-screen"
    timeout: 30000
- assertVisible:
    id: "trainer-detail-all"
- extendedWaitUntil:
    visible:
      id: "trainer-detail-card"
    timeout: 30000
- assertVisible:
    id: "trainer-detail-about"
- runFlow:
    when:
      visible:
        id: "trainer-detail-ask"
    commands:
      - tapOn:
          id: "trainer-detail-ask"
      - extendedWaitUntil:
          visible:
            id: "trainer-detail-dialog"
          timeout: 10000
      - tapOn:
          id: "trainer-detail-dialog-cancel"
      - extendedWaitUntil:
          notVisible:
            id: "trainer-detail-dialog"
          timeout: 10000
- tapOn:
    id: "trainer-detail-all"
- extendedWaitUntil:
    visible:
      id: "trainers-screen"
    timeout: 30000
