# Discards the running session (the cleanup half of start-workout.yaml):
# Exit opens "Discard this workout?", Discard abandons the session server-side,
# so nothing is recorded. Ends on the Workout hub (T-65: an inner page, no
# tab bar on phone; the tablet never had bottom-nav).
appId: com.gymido.app
---
- runFlow: dismiss-session-dialogs.yaml
# A sheet left open by a failed step would cover the chrome.
- runFlow:
    when:
      visible:
        id: "exercise-sheet"
    commands:
      - tapOn:
          id: "exercise-sheet-close"
      - extendedWaitUntil:
          notVisible:
            id: "exercise-sheet"
          timeout: 5000
- tapOn:
    id: "session-exit"
- extendedWaitUntil:
    visible:
      id: "discard-dialog"
    timeout: 10000
- tapOn:
    id: "discard-confirm"
- extendedWaitUntil:
    notVisible:
      id: "session-chrome"
    timeout: 30000
# F1 (final pass 5f53f3d, PM 28 Oct 2026; declared): was bottom-nav.
- extendedWaitUntil:
    visible:
      id: "workout-hub-header"
    timeout: 30000
