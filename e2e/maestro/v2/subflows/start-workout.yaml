# Starts a workout from Today and leaves the app in the running session
# (session-chrome visible). ALWAYS pair with discard-workout.yaml.
#
# Fixture: the account needs an ACTIVE plan (Today shows its today card).
# Refuses to touch a session that already exists (it would be someone's real
# workout): Workout must open on its hub, not on a running session.
appId: com.gymido.app
---
- extendedWaitUntil:
    visible:
      id: "tab-Today|rail-Today"
    timeout: 30000
# Phone tab bar or the tablet rail (flow run ea27f77).
- runFlow:
    when:
      visible:
        id: "tab-Today"
    commands:
      - tapOn:
          id: "tab-Today"
- runFlow:
    when:
      visible:
        id: "rail-Today"
    commands:
      - tapOn:
          id: "rail-Today"
# QA candidate-9643e9c: Today keeps its scroll position (01-today ends at
# the weight card), so scroll back up to the top state first.
- scrollUntilVisible:
    element:
      id: "home-today-primary|home-empty-hero|home-error"
    direction: UP
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "home-today-primary|home-empty-hero|home-error"
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: "home-today-primary"
    commands:
      - assertTrue:
          condition: ${false}
          label: "Fixture missing: this account has no active plan, so no workout can start (Today shows the empty or error state)."
- tapOn:
    id: "home-today-primary"
# DECLARED (T-140, PM-approved: the A-balanced Workout page): was
# workout-hero-start / workout-day-start-.* (the retired hub). Now the page's
# ONE gold action (today's Start, or the most recent missed day's catch-up),
# else a day sheet's Start ("Start early" / catch-up). Both of those ask
# first (T-80 / T-102 confirm). Known limit (accepted by design): a Sunday
# with nothing missed and no day left offers no start.
- scrollUntilVisible:
    element:
      id: "workout-primary-action|workout-day-[0-6]|session-chrome|workout-error|workout-empty|schedule-setup"
    direction: DOWN
    centerElement: true
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "session-chrome"
    commands:
      - assertTrue:
          condition: ${false}
          label: "A workout session already existed before this flow; not discarding it. Run v2/cleanup/discard-active-session.yaml if it is a leftover test session."
- evalScript: ${output.v2WorkoutTapped = false}
- runFlow:
    when:
      visible:
        id: "workout-primary-action"
    commands:
      - tapOn:
          id: "workout-primary-action"
      - evalScript: ${output.v2WorkoutTapped = true}
# Day 0: open its sheet; take its Start (start early / catch-up) when it
# has one, else close it.
- runFlow:
    when:
      true: ${output.v2WorkoutTapped !== true}
    commands:
      - tapOn:
          id: "workout-day-0"
      - extendedWaitUntil:
          visible:
            id: "workout-day-sheet"
          timeout: 10000
      - runFlow:
          when:
            visible:
              id: "workout-sheet-action"
          commands:
            - tapOn:
                id: "workout-sheet-action"
            - evalScript: ${output.v2WorkoutTapped = true}
      - runFlow:
          when:
            true: ${output.v2WorkoutTapped !== true}
          commands:
            - tapOn:
                id: "app-modal-close"
# Day 1: open its sheet; take its Start (start early / catch-up) when it
# has one, else close it.
- runFlow:
    when:
      true: ${output.v2WorkoutTapped !== true}
    commands:
      - tapOn:
          id: "workout-day-1"
      - extendedWaitUntil:
          visible:
            id: "workout-day-sheet"
          timeout: 10000
      - runFlow:
          when:
            visible:
              id: "workout-sheet-action"
          commands:
            - tapOn:
                id: "workout-sheet-action"
            - evalScript: ${output.v2WorkoutTapped = true}
      - runFlow:
          when:
            true: ${output.v2WorkoutTapped !== true}
          commands:
            - tapOn:
                id: "app-modal-close"
