# Starts a workout from Today and leaves the app in the running session
# (session-chrome visible). ALWAYS pair with discard-workout.yaml.
#
# Fixture: the account needs an ACTIVE plan (Today shows its today card).
# Refuses to touch a session that already exists (it would be someone's real
# workout): Workout must open on its hub, not on a running session.
appId: com.gymido.app
---
- extendedWaitUntil:
    visible:
      id: "tab-Today|rail-Today"
    timeout: 30000
# Phone tab bar or the tablet rail (flow run ea27f77).
- runFlow:
    when:
      visible:
        id: "tab-Today"
    commands:
      - tapOn:
          id: "tab-Today"
- runFlow:
    when:
      visible:
        id: "rail-Today"
    commands:
      - tapOn:
          id: "rail-Today"
# QA candidate-9643e9c: Today keeps its scroll position (01-today ends at
# the weight card), so scroll back up to the top state first.
- scrollUntilVisible:
    element:
      id: "home-today-primary|home-empty-hero|home-error"
    direction: UP
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "home-today-primary|home-empty-hero|home-error"
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: "home-today-primary"
    commands:
      - assertTrue:
          condition: ${false}
          label: "Fixture missing: this account has no active plan, so no workout can start (Today shows the empty or error state)."
- tapOn:
    id: "home-today-primary"
- extendedWaitUntil:
    visible:
      id: "workout-hero-start|workout-day-start-.*|session-chrome|workout-error|workout-empty|schedule-setup"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "session-chrome"
    commands:
      - assertTrue:
          condition: ${false}
          label: "A workout session already existed before this flow; not discarding it. Run v2/cleanup/discard-active-session.yaml if it is a leftover test session."
- evalScript: ${output.v2WorkoutTapped = false}
- runFlow:
    when:
      visible:
        id: "workout-hero-start"
    commands:
      - tapOn:
          id: "workout-hero-start"
      - evalScript: ${output.v2WorkoutTapped = true}
# Not a training day today: start the plan's first listed day instead.
- runFlow:
    when:
      true: ${output.v2WorkoutTapped !== true}
    commands:
      - scrollUntilVisible:
          element:
            id: "workout-day-start-.*"
          direction: DOWN
          centerElement: true
          timeout: 20000
      - tapOn:
          id: "workout-day-start-.*"
          index: 0
      # T-80 (DECLARED): a day other than today's planned one asks first
      # ("Start {Day} …?"); confirm with its gold "Start workout".
      - extendedWaitUntil:
          visible:
            id: "workout-start-confirm-confirm"
          timeout: 10000
      - tapOn:
          id: "workout-start-confirm-confirm"
# E1 (final pass 5f53f3d): on a fresh install the first start asks for
# notifications (iOS: “Gymido” Would Like to Send You Notifications), which
# covers the session. Optional, when visible only: declined, nothing changes.
# Carry 4 (PM 28 Oct 2026; DECLARED, was 6000): the prompt is asked at the
# Start tap itself (WorkoutScreen handleStart), so 3 s is ample, and the
# session-chrome wait below (30 s) still covers a slow session.
- extendedWaitUntil:
    visible: ".*[Ss]end [Yy]ou [Nn]otifications.*"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: ".*[Ss]end [Yy]ou [Nn]otifications.*"
    commands:
      - tapOn: "Don.t [Aa]llow"
- extendedWaitUntil:
    visible:
      id: "session-chrome"
    timeout: 30000
- runFlow: dismiss-session-dialogs.yaml
- assertVisible:
    id: "session-exit"
- assertNotVisible:
    id: "bottom-nav"
