# T-162 shots, step 5 (phone): from set 2 of exercise 1 (4 sets): log it → minimise the rest (the disc + Up next clear of
# it, P3) → expand → Skip; log 3 and 4 → the "next exercise" rest → −5 down to the red last 5 s → it ends; then set 1 of
# exercise 2. IDs only; run t146/02-discard.yaml after it.
appId: com.gymido.app
---
- runFlow: ../subflows/log-current-set.yaml
- extendedWaitUntil: { visible: { id: "rest-sheet-handle" }, timeout: 10000 }
- tapOn: { id: "rest-sheet-handle" }
- extendedWaitUntil: { visible: { id: "rest-mini-ring" }, timeout: 5000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-05-disc
- tapOn: { id: "rest-mini-ring" }
- extendedWaitUntil: { visible: { id: "rest-timer-skip" }, timeout: 5000 }
- tapOn: { id: "rest-timer-skip" }
- extendedWaitUntil: { notVisible: { id: "rest-timer" }, timeout: 5000 }
- runFlow: ../subflows/dismiss-session-dialogs.yaml
- runFlow: ../subflows/log-current-set.yaml
- extendedWaitUntil: { visible: { id: "rest-timer-skip" }, timeout: 10000 }
- tapOn: { id: "rest-timer-skip" }
- extendedWaitUntil: { notVisible: { id: "rest-timer" }, timeout: 5000 }
- runFlow: ../subflows/dismiss-session-dialogs.yaml
- runFlow: ../subflows/log-current-set.yaml
- extendedWaitUntil: { visible: { id: "rest-timer-skip" }, timeout: 10000 }
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-06-rest-next
- repeat:
    times: 17
    commands:
      - tapOn: { id: "rest-timer-minus" }
- takeScreenshot: ${SHOT}-07-rest-red
- extendedWaitUntil: { notVisible: { id: "rest-timer" }, timeout: 15000 }
- runFlow: ../subflows/dismiss-session-dialogs.yaml
- waitForAnimationToEnd: { timeout: 3000 }
- takeScreenshot: ${SHOT}-08-ex2-set1
