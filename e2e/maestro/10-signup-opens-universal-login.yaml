# Sign up opens Auth0 Universal Login in the system browser (with
# screen_hint: 'signup'), and cancelling returns to Welcome.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-out.yaml
- tapOn:
    id: "welcome-sign-up"
- waitForAnimationToEnd:
    timeout: 8000
- runFlow: subflows/dismiss-browser-interstitials.yaml
- runFlow: subflows/wait-for-login-form.yaml
- assertVisible: "Continue with Google"
- runFlow: subflows/cancel-universal-login.yaml
- extendedWaitUntil:
    visible:
      id: "welcome-log-in"
    timeout: 60000
