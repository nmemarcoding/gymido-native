# Spec §4: sign out lands on Welcome, not back in Auth0.
# Runs signed in — execute after 04.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-in.yaml
# Trainer mode: switch to the member workspace first (the Workspace switch
# sits on the trainer Profile tab), or tab-Profile never appears.
# Phone tab bar or the tablet rail (QA candidate-9643e9c flow defect).
- runFlow:
    when:
      visible:
        id: "tab-TProfile"
    commands:
      - tapOn:
          id: "tab-TProfile"
- runFlow:
    when:
      visible:
        id: "rail-TProfile"
    commands:
      - tapOn:
          id: "rail-TProfile"
- runFlow:
    when:
      visible:
        id: "mode-switch-member"
    commands:
      - tapOn:
          id: "mode-switch-member"
      - extendedWaitUntil:
          visible:
            id: "tab-Profile|rail-Profile"
          timeout: 20000
# Member mode: the Profile root holds the account actions.
- runFlow:
    when:
      visible:
        id: "tab-Profile"
    commands:
      - tapOn:
          id: "tab-Profile"
- runFlow:
    when:
      visible:
        id: "rail-Profile"
    commands:
      - tapOn:
          id: "rail-Profile"
# Centre the button, or the tap lands on the floating tab bar above it.
- scrollUntilVisible:
    element:
      id: "settings-sign-out"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "settings-sign-out"
# iOS asks before Auth0's clearSession opens its browser session.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Continue"
          optional: true
- extendedWaitUntil:
    visible:
      id: "welcome-log-in"
    timeout: 60000
- assertNotVisible: "Continue with Google|Reset password"
