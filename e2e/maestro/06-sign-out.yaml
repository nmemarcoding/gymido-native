# Spec §4: sign out lands on Welcome, not back in Auth0.
# Runs signed in — execute after 04.
# REQUIRES an account WITH a profile: Settings (and Sign out) live in the app
# shell's Settings tab; a profile-less account stops on Create Profile, which
# has no sign-out (RN-SPEC-profile-create ⚠P7).
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-in.yaml
- runFlow: subflows/sign-out.yaml
- assertNotVisible: "Continue with Google"
