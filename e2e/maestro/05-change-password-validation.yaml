# Spec §5 validation, checked on submit only and in order.
# Deliberately never submits a valid password: a smoke run must not change the
# test account's credentials.
# Runs signed in — execute after 04.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-in.yaml
- extendedWaitUntil:
    visible:
      id: "placeholder-open-settings"
    timeout: 90000
- tapOn:
    id: "placeholder-open-settings"
- tapOn:
    id: "settings-change-password"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 20000
- tapOn:
    id: "change-password-submit"
- assertVisible: "Password must be at least 8 characters."
- tapOn:
    id: "change-password-new"
- inputText: "Gymido.Smoke.2026a"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "change-password-confirm"
- inputText: "Gymido.Smoke.2026b"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "change-password-submit"
- assertVisible: "Passwords do not match."
- tapOn:
    id: "change-password-cancel"
- assertVisible: "Settings"
