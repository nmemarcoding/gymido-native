# RN-SPEC-profile P1a (25 Oct 2026, T-32 H1): the modal now sends a reset
# email instead of taking a password. Opens it and cancels; deliberately never
# taps "Send reset email", so a smoke run sends no mail to the test account.
# (The file name is kept from the old validation flow.)
# Runs signed in — execute after 04.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-in.yaml
# Trainer mode: switch to the member workspace first (the Workspace switch
# sits on the trainer Profile tab), or tab-Profile never appears.
- runFlow:
    when:
      visible:
        id: "tab-TProfile"
    commands:
      - tapOn:
          id: "tab-TProfile"
      - tapOn:
          id: "mode-switch-member"
      - extendedWaitUntil:
          visible:
            id: "tab-Profile"
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: "tab-Profile"
    timeout: 90000
- tapOn:
    id: "tab-Profile"
- scrollUntilVisible:
    element:
      id: "settings-change-password"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "settings-change-password"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 20000
- assertVisible: "Send reset email"
- tapOn:
    id: "change-password-cancel"
# Back on the Profile root (P1 replaced the old "Settings" title).
- assertVisible:
    id: "settings-change-password"
