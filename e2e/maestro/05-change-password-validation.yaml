# Spec §5 validation, checked on submit only and in order.
# Deliberately never submits a valid password: a smoke run must not change the
# test account's credentials.
# Runs signed in — execute after 04.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-in.yaml
# Trainer mode: switch to the member workspace first (the Workspace switch
# sits on the trainer Profile tab), or tab-Profile never appears.
- runFlow:
    when:
      visible:
        id: "tab-TProfile"
    commands:
      - tapOn:
          id: "tab-TProfile"
      - tapOn:
          id: "mode-switch-member"
      - extendedWaitUntil:
          visible:
            id: "tab-Profile"
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: "tab-Profile"
    timeout: 90000
- tapOn:
    id: "tab-Profile"
- scrollUntilVisible:
    element:
      id: "settings-change-password"
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: "settings-change-password"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 20000
- tapOn:
    id: "change-password-submit"
- assertVisible: "Password must be at least 8 characters."
- tapOn:
    id: "change-password-new"
- inputText: "Gymido.Smoke.2026a"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "change-password-confirm"
- inputText: "Gymido.Smoke.2026b"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "change-password-submit"
- assertVisible: "Passwords do not match."
- tapOn:
    id: "change-password-cancel"
# Back on the Profile root (P1 replaced the old "Settings" title).
- assertVisible:
    id: "settings-change-password"
