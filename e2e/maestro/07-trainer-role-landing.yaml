# Spec §4 landing rules, trainer account.
#
# What this proves: the tenant Action puts an Auth0 RBAC role into the
# `https://gymido.app/roles` claim and the app reads it. The placeholder screens
# print "Roles: …", so the assertion reads it straight off the device.
# Verified 2026-09-17 on Android: "Roles: Trainer" rendered.
#
# The Auth0 role is "Trainer" (capital T) while roles.js compares
# case-insensitively, so the assertion is deliberately loose on case.
#
# Landing: the Trainer workspace, on Dashboard. Since 25 Sep 2026 this account
# is the E2E rig, with a profile and an active plan (created through the app),
# so the profile gate passes and the role rule lands it on the trainer tabs.
# This closes the old gap where the Trainer-dashboard branch of resolveLanding
# was unreachable from the app.
#
# Needs MAESTRO_TRAINER_EMAIL / MAESTRO_TRAINER_PASSWORD; npm run e2e:* supplies them (see README).
#
# Side effect: an interactive trainer login sets the stored workspace to
# "trainer" and that survives sign-out by design (workspacePreference.js), so
# this flow leaves state behind. Harmless — the landing rules only read the
# workspace for users who actually hold the trainer role.
appId: com.gymido.app
---
- runFlow:
    file: subflows/sign-in-as.yaml
    env:
      LOGIN_EMAIL: ${MAESTRO_TRAINER_EMAIL}
      LOGIN_PASSWORD: ${MAESTRO_TRAINER_PASSWORD}
      REQUIRE_FORM: 'true'
- extendedWaitUntil:
    visible:
      id: "tab-TrainerDashboardTab"
    timeout: 90000
# The page itself, not the "Dashboard" tab label: a blank Home under the
# trainer tab bar used to pass here.
- assertVisible:
    id: "coming-soon-TrainerDashboardTab"
- assertNotVisible: "Account unavailable"
