# Signs in with the member test account and checks the landing screen.
# Requires -e MEMBER_EMAIL=... -e MEMBER_PASSWORD=... (see README).
# A member with no profile lands on Onboarding (spec §4 profile gate).
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-out.yaml
- tapOn:
    id: "welcome-log-in"
- waitForAnimationToEnd:
    timeout: 8000
- runFlow: subflows/dismiss-browser-interstitials.yaml
- runFlow: subflows/wait-for-login-form.yaml
- runFlow:
    file: subflows/fill-login-form.yaml
    env:
      LOGIN_EMAIL: ${MEMBER_EMAIL}
      LOGIN_PASSWORD: ${MEMBER_PASSWORD}
- extendedWaitUntil:
    visible: "Signed in as ${MEMBER_EMAIL}"
    timeout: 90000
# T-53 item 40 (DECLARED): was the text "Onboarding|Home" (the 1.0 placeholder
# era; no screen draws "Onboarding"). Any signed-in landing by id, Create
# profile (P1, an account without a profile) included.
- assertVisible:
    id: "tab-Today|rail-Today|desktop-sidebar|create-profile-root"
