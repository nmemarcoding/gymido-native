# Leaves the app on the Welcome screen, signing out first if a session exists.
appId: com.gymido.app
---
- runFlow: launch-dev-client.yaml
# Trainer mode: switch to the member workspace (the Workspace switch sits on
# the trainer tabs); sign-out then lives on the member Profile tab below.
- runFlow:
    when:
      visible:
        id: "tab-TProfile"
    commands:
      - tapOn:
          id: "tab-TProfile"
      - tapOn:
          id: "mode-switch-member"
      - extendedWaitUntil:
          visible:
            id: "tab-Profile"
          timeout: 20000
# Tablet (QA candidate-dfd9b85 carry 2: ios-safe-sign-in failed here on an
# iPad): the rail instead of the tabs, the same switch as member-workspace.
- runFlow:
    when:
      visible:
        id: "rail-TProfile"
    commands:
      - tapOn:
          id: "rail-TProfile"
      - scrollUntilVisible:
          element:
            id: "mode-switch-member"
          direction: DOWN
          centerElement: true
          timeout: 10000
      - tapOn:
          id: "mode-switch-member"
      - extendedWaitUntil:
          visible:
            id: "rail-Profile"
          timeout: 20000
# Member mode (5-tab nav): the Profile tab root holds the account actions.
- runFlow:
    when:
      visible:
        id: "tab-Profile"
    commands:
      - tapOn:
          id: "tab-Profile"
      # On a small phone (iPhone SE) sign-out starts below the fold, so
      # scroll to it rather than wait for it.
      - scrollUntilVisible:
          element:
            id: "settings-sign-out"
          direction: DOWN
          centerElement: true
          timeout: 20000
# Tablet member mode: the rail's Profile item opens the same page.
- runFlow:
    when:
      visible:
        id: "rail-Profile"
    commands:
      - tapOn:
          id: "rail-Profile"
      - scrollUntilVisible:
          element:
            id: "settings-sign-out"
          direction: DOWN
          centerElement: true
          timeout: 20000
- runFlow:
    when:
      visible:
        id: "settings-sign-out"
    commands:
      # P1 is taller than the old Settings page: centre the button first, or
      # the tap lands on the floating tab bar above it.
      - scrollUntilVisible:
          element:
            id: "settings-sign-out"
          direction: DOWN
          centerElement: true
          timeout: 10000
      - tapOn:
          id: "settings-sign-out"
      # iOS asks before Auth0's clearSession opens its browser session.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: "Continue"
                optional: true
- runFlow:
    when:
      visible:
        id: "account-unavailable-sign-out"
    commands:
      - tapOn:
          id: "account-unavailable-sign-out"
- extendedWaitUntil:
    visible:
      id: "welcome-log-in"
    timeout: 60000
