# Leaves the app on the Welcome screen, signing out first if a session exists.
appId: com.gymido.app
---
- runFlow: launch-dev-client.yaml
# Trainer mode: the dashboard has no Settings button; its Profile tab does.
- runFlow:
    when:
      visible:
        id: "tab-TProfile"
    commands:
      - tapOn:
          id: "tab-TProfile"
      - extendedWaitUntil:
          visible:
            id: "placeholder-open-settings"
          timeout: 20000
# On a placeholder screen: go to Settings first.
- runFlow:
    when:
      visible:
        id: "placeholder-open-settings"
    commands:
      - tapOn:
          id: "placeholder-open-settings"
      - extendedWaitUntil:
          visible:
            id: "settings-sign-out"
          timeout: 20000
- runFlow:
    when:
      visible:
        id: "settings-sign-out"
    commands:
      - tapOn:
          id: "settings-sign-out"
      # iOS asks before Auth0's clearSession opens its browser session.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: "Continue"
                optional: true
- runFlow:
    when:
      visible:
        id: "account-unavailable-sign-out"
    commands:
      - tapOn:
          id: "account-unavailable-sign-out"
- extendedWaitUntil:
    visible:
      id: "welcome-log-in"
    timeout: 60000
