# The Personal workspace's Settings tab (Change password, Sign out). The E2E rig
# is a trainer, and trainers land in the Trainer workspace, whose tab set has
# no Settings tab: switch through the Workspace block on the trainer Profile tab.
appId: com.gymido.app
---
# Member workspace is the common case: a positive check on its tab-SettingsTab is
# instant, and the Trainer-workspace switch only runs when it is absent
# (a false `visible` check would wait ~7 s; see ensure-app-running).
- evalScript: ${output.inPersonal = false}
- runFlow:
    when:
      visible:
        id: "tab-SettingsTab"
    commands:
      - evalScript: ${output.inPersonal = true}
- runFlow:
    when:
      true: ${!output.inPersonal}
    commands:
      - tapOn:
          id: "tab-TrainerProfileTab"
      - tapOn: "Personal"
- extendedWaitUntil:
    visible:
      id: "tab-SettingsTab"
    timeout: 30000
- tapOn:
    id: "tab-SettingsTab"
