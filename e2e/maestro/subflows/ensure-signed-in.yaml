# Leaves the app on a signed-in screen, logging in first if needed.
#
# Flows must not assume run order: Maestro does not execute files
# alphabetically (observed order: 04, 06, 01, 03, 02, 05), so a flow that needs
# a session has to establish it itself.
#
# Requires MEMBER_EMAIL / MEMBER_PASSWORD when a login is actually needed.
appId: com.gymido.app
---
- runFlow: launch-app.yaml
- runFlow:
    when:
      visible:
        id: "welcome-log-in"
    commands:
      - runFlow:
          file: login.yaml
          env:
            LOGIN_EMAIL: ${MEMBER_EMAIL}
            LOGIN_PASSWORD: ${MEMBER_PASSWORD}
- extendedWaitUntil:
    visible: "Workout|Create Profile|Dashboard|Settings|Coaching"
    timeout: 90000
