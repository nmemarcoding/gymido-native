# Closes the hosted Auth0 page without signing in (recorded elements).
#   Android: the Custom Tab's own "Close tab" button (id close_button).
#   iOS: the web-auth sheet's "Cancel" (id Close), or "Cancel" on the system
#   "Wants to Use" sheet if it is still up.
appId: com.gymido.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "com.android.chrome:id/close_button"
- runFlow:
    when:
      platform: iOS
      visible: ".*Wants to Use.*"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      platform: iOS
      visible:
        id: "Close"
    commands:
      - tapOn:
          id: "Close"
