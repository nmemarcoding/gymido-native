# Closes the hosted Auth0 page without signing in (recorded elements).
#   Android: the Custom Tab's own "Close tab" button (id close_button).
#   iOS: the web-auth sheet's "Cancel" (id Close), or "Cancel" on the system
#   "Wants to Use" sheet if it is still up.
appId: com.gymido.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "com.android.chrome:id/close_button"
# iOS: the page's Close button is the usual case, so check it first (an
# absent element costs ~7 s per check); the earlier system sheet only matters
# when Close isn't there.
- evalScript: ${output.loginCancelled = false}
- runFlow:
    when:
      platform: iOS
      visible:
        id: "Close"
    commands:
      - tapOn:
          id: "Close"
      - evalScript: ${output.loginCancelled = true}
- runFlow:
    when:
      platform: iOS
      true: ${!output.loginCancelled}
    commands:
      - runFlow:
          when:
            visible: ".*Wants to Use.*"
          commands:
            - tapOn: "Cancel"
