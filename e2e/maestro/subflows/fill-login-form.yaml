# Fills and submits Auth0's hosted login form.
#
# Requires LOGIN_EMAIL and LOGIN_PASSWORD. Callers pass them per account, so
# this subflow is not tied to the member fixture:
#
#   - runFlow:
#       file: subflows/fill-login-form.yaml
#       env:
#         LOGIN_EMAIL: ${TRAINER_EMAIL}
#         LOGIN_PASSWORD: ${TRAINER_PASSWORD}
#
# Android exposes the form's DOM ids (username/password) once the page is
# interacted with, but not always before that, so each tap falls back to the
# field's on-screen position when the id is missing.
appId: com.gymido.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible:
              id: "username"
          commands:
            - tapOn:
                id: "username"
      - runFlow:
          when:
            notVisible:
              id: "username"
          commands:
            - tapOn:
                point: "50%,33%"
      - inputText: ${LOGIN_EMAIL}
      - runFlow:
          when:
            visible:
              id: "password"
          commands:
            - tapOn:
                id: "password"
      - runFlow:
          when:
            notVisible:
              id: "password"
          commands:
            - tapOn:
                point: "50%,39%"
      - inputText: ${LOGIN_PASSWORD}
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ".*Email address.*"
      - inputText: ${LOGIN_EMAIL}
      - tapOn: ".*Password.*"
      - inputText: ${LOGIN_PASSWORD}
# Android only: hideKeyboard fails on iOS ("Couldn't hide the keyboard") because
# the hosted page's inputs are web fields with no standard dismiss action.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# "Continue" has no trailing space, so it matches directly.
- tapOn: "Continue"
