# T-29 stage 4: submit, then wait for the signed-in app.
# hideKeyboard first: the keyboard's accessory bar covers "Continue".
# hideKeyboard can itself submit the form (the return key), so "Continue" may
# already be gone: the tap is optional and tab-Today is the real check.
appId: com.gymido.app
---
# Enter in the focused password field submits the form. hideKeyboard failed
# on a Release build (27 Oct: "Hide Keyboard... FAILED") and could itself
# submit; Enter is deterministic. Continue stays as an optional fallback.
- pressKey: Enter
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-Today"
    timeout: 60000
