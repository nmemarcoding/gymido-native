# Spec §7.1: a signed-out cold start must never open Auth0 on its own.
appId: com.gymido.app
---
- runFlow: subflows/ensure-signed-out.yaml
# The spec is about a COLD start, so restart the app even when the previous
# flow left it on Welcome.
- runFlow:
    when:
      # ensure-signed-out may have just cold-launched the app (output.coldLaunched,
      # cleared again by a UI sign-out); a second cold launch would only cost time.
      true: ${!output.coldLaunched}
    file: subflows/launch-app.yaml
- assertVisible: "Gymido"
- assertVisible:
    id: "welcome-log-in"
- assertVisible:
    id: "welcome-sign-up"
# Anchored on the Google button: Auth0's field labels carry a trailing space
# and Chrome does not always expose the form's field nodes, so either of those
# would pass vacuously whether or not the page was open.
- assertNotVisible: "Continue with Google"
