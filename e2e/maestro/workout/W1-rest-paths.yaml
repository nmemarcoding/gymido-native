# Crash hunt, rest paths (RN-SPEC-time §7.2, O4, O13): +5s, −5s to zero (the
# silent end), skip, un-complete during a rest, and a natural end at zero.
# Draw-time crashes hide when backgrounded, so the screen must stay on and the
# app in the foreground throughout (adb shell svc power stayon true).
# Requires the plan's sets to carry a planned rest.
appId: com.gymido.app
---
- runFlow: ../subflows/open-personal-workout.yaml
- runFlow: ../subflows/start-session.yaml

- takeScreenshot: w1-s1-start
# 1. +5s, then −5s all the way to zero: the silent end (no alert, no advance).
- runFlow: ../subflows/log-next-set.yaml
- extendedWaitUntil:
    visible:
      id: "rest-timer-expanded"
    timeout: 20000
- tapOn: "Increase rest timer by 5 seconds"
- repeat:
    while:
      visible:
        id: "rest-timer-expanded"
    times: 60
    commands:
      - tapOn: "Decrease rest timer by 5 seconds"
- assertNotVisible:
    id: "rest-timer-expanded"
- assertVisible:
    id: "session-scroll"

- takeScreenshot: w1-s2-start
# 2. Skip.
- runFlow: ../subflows/log-next-set.yaml
- extendedWaitUntil:
    visible:
      id: "rest-timer-expanded"
    timeout: 20000
- tapOn:
    id: "rest-timer-skip"
- assertNotVisible:
    id: "rest-timer-expanded"

- takeScreenshot: w1-s3-start
# 3. Un-complete the set while its rest runs: the rest clears.
- runFlow: ../subflows/log-next-set.yaml
- extendedWaitUntil:
    visible:
      id: "rest-timer-expanded"
    timeout: 20000
# Un-complete the set whose rest is running: set 3 (each run starts a fresh
# session and logs sets 1-3 in order). Addressed by its row, and centred so the
# floating timer (it covers the top of the list) can't sit over it. "Undo"
# index 0 and "above: Did it" both hit set 1/2 under the timer.
- scrollUntilVisible:
    element:
      id: "set-action-.*"
      childOf:
        id: "set-row-.*"
        containsDescendants:
          - text: "Weight for set 3"
    direction: UP
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: w1-s3-before-undo
- tapOn:
    id: "set-action-.*"
    childOf:
      id: "set-row-.*"
      containsDescendants:
        - text: "Weight for set 3"
- extendedWaitUntil:
    notVisible:
      id: "rest-timer-expanded"
    timeout: 20000

- takeScreenshot: w1-s4-start
# 4. Natural end at zero, in the foreground — the path that used to crash.
- runFlow: ../subflows/log-next-set.yaml
- extendedWaitUntil:
    visible:
      id: "rest-timer-expanded|rest-timer-collapsed"
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: "rest-timer-layer"
    timeout: 400000
- assertVisible:
    id: "session-scroll"

- runFlow: ../subflows/discard-session.yaml
- takeScreenshot: w1-end
